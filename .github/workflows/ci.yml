name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    env:
      # Swift 6 otherwise defaults this package to a macOS 12 triple.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version
          xcodebuild -version || true
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Package the app
        run: make app
