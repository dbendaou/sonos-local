    <text x="420" y="680" fill="#b0b0b0" font-size="13">Queue</text>

    <rect x="420" y="704" width="420" height="3" rx="1.5" fill="#e6e6e6"/>
    <rect x="420" y="704" width="168" height="3" rx="1.5" fill="#111"/>
    <circle cx="588" cy="705.5" r="6" fill="#111"/>
    <text x="420" y="726" fill="#8a8a8a" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1:24</text>
    <text x="808" y="726" fill="#8a8a8a" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">-1:58</text>

