    <path d="M1034 559c1.6 1.5 1.6 6 0 7.5" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="1044" y="562" width="250" height="3" rx="1.5" fill="#e6e6e6"/>
    <rect x="1044" y="562" width="90" height="3" rx="1.5" fill="#111"/>
    <circle cx="1134" cy="563.5" r="5" fill="#111"/>

    <text x="1024" y="604" fill="#8a8a8a" font-size="12" font-weight="600">Rooms</text>

    <rect x="1024" y="618" width="340" height="36" rx="8" fill="#f3f3f3"/>
    <text x="1036" y="641" fill="#111" font-size="13" font-weight="600">Living Room</text>
    <path d="M1336 634l4 4 8-9" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="1036" y="680" fill="#111" font-size="13">Kitchen</text>
    <text x="1036" y="712" fill="#111" font-size="13">Bedroom</text>

    <text x="1024" y="778" fill="#8a8a8a" font-size="12" font-weight="500">Open window</text>
    <circle cx="1348" cy="774" r="6" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
    <circle cx="1348" cy="774" r="2" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
