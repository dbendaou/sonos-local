      <path d="M1112 524l-11 6.5v-13z"/>
      <path d="M1276 517.5l11 6.5-11 6.5z"/>
      <path d="M1292 517.5l11 6.5-11 6.5z"/>
    </g>
    <circle cx="1194" cy="524" r="22" fill="#111"/>
    <rect x="1186" y="514" width="5" height="20" rx="1.2" fill="#fff"/>
    <rect x="1197" y="514" width="5" height="20" rx="1.2" fill="#fff"/>

    <g fill="#8a8a8a">
      <path d="M1024 558h3.2l4.2-3.2v12.4l-4.2-3.2h-3.2z"/>
