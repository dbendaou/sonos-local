<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Sonos Local</title>
  <desc id="desc">The Sonos Local window and menu bar popover: room cards, large artwork, and playback controls.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <filter id="shadow-soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="32" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a342e"/>
      <stop offset="0.55" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#0e0d0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.28" r="0.72">
      <stop offset="0" stop-color="#f6f1ea" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#d9cfc3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d9cfc3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover-sm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a342e"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="#efefef"/>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="48" y="56" width="920" height="788" rx="18" fill="#ffffff"/>
  </g>
  <g fill="#ff5f57"><circle cx="78" cy="82" r="6"/></g>
  <g fill="#febc2e"><circle cx="98" cy="82" r="6"/></g>
  <g fill="#28c840"><circle cx="118" cy="82" r="6"/></g>

  <!-- Toolbar capsule -->
  <rect x="792" y="68" width="152" height="36" rx="18" fill="#f4f4f4"/>
  <g fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
    <path d="M814 80h12M814 86h12M814 92h8"/>
    <path d="M848 86l2.2-4.6 2.2 4.6 2.2-4.6 2.2 4.6"/>
    <circle cx="882" cy="86" r="5"/>
    <path d="M876 86h12"/>
    <path d="M910 80v12M904 86h12"/>
  </g>

  <!-- Rooms column -->
  <text x="80" y="148" fill="#111" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="34" font-weight="400">Rooms</text>
  <text x="80" y="174" fill="#8a8a8a" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13">In your home</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <rect x="72" y="198" width="300" height="92" rx="18" fill="#ececec"/>
    <text x="90" y="234" fill="#111" font-size="16" font-weight="600">Living Room</text>
    <text x="90" y="256" fill="#8a8a8a" font-size="13">Night Shift</text>
    <rect x="292" y="216" width="56" height="56" rx="8" fill="url(#cover-sm)"/>
    <circle cx="312" cy="236" r="10" fill="#f3efe8" opacity="0.9"/>

    <rect x="72" y="302" width="300" height="92" rx="18" fill="#f6f6f6"/>
    <text x="90" y="338" fill="#111" font-size="16" font-weight="600">Kitchen</text>
    <text x="90" y="360" fill="#8a8a8a" font-size="13">Not playing</text>
