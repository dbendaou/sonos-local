    <rect x="1024" y="464" width="136" height="3" rx="1.5" fill="#111"/>
    <circle cx="1160" cy="465.5" r="5.5" fill="#111"/>
    <text x="1024" y="484" fill="#8a8a8a" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1:24</text>
    <text x="1364" y="484" fill="#8a8a8a" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">-1:58</text>

    <g fill="#111">
